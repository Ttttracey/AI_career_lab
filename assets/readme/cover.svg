<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">AI 转行练习场</title>
<desc id="desc">米白色柔和背景中的产品名称、设计理念与从目标到档案的成长路径</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f7f5f0"/>
    <stop offset=".55" stop-color="#f9f8f4"/>
    <stop offset="1" stop-color="#e8eee6"/>
  </linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fffefa" stop-opacity=".98"/>
    <stop offset="1" stop-color="#f5f7ee" stop-opacity=".9"/>
  </linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="48"/></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#557160" flood-opacity=".13"/>
  </filter>
</defs>
<rect width="1200" height="420" rx="32" fill="url(#bg)"/>
<circle cx="1070" cy="40" r="180" fill="#dfe7d7" opacity=".58" filter="url(#blur)"/>
<circle cx="160" cy="395" r="150" fill="#f0ddc8" opacity=".5" filter="url(#blur)"/>
<rect x="44" y="38" width="1112" height="344" rx="30" fill="url(#card)" stroke="#fff" filter="url(#shadow)"/>
<g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" fill="#303a34">
  <circle cx="96" cy="92" r="24" fill="#e6ede2"/>
  <path d="M87 101c1-16 11-22 20-20-1 12-7 20-20 20Zm1 0c2-7 8-13 17-17" fill="none" stroke="#426b57" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="135" y="99" font-size="18" font-weight="700" letter-spacing="2">AI 转行练习场</text>
  <rect x="951" y="69" width="153" height="38" rx="19" fill="#eaf0e8"/>
  <text x="1027" y="94" text-anchor="middle" font-size="14" fill="#426b57">本地学习 · 真实留存</text>
  <text x="91" y="188" font-size="44" font-weight="700" letter-spacing="2">把学过的知识，</text>
  <text x="91" y="245" font-size="44" font-weight="700" letter-spacing="2">变成做得出、讲得清的产品能力。</text>
  <text x="94" y="292" font-size="18" fill="#68746b">从一份目标岗位开始，用回答、作品与复盘，找到下一步。</text>
</g>
<g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600">
  <path d="M115 341H1076" stroke="#d7dfd3" stroke-width="2"/>
  <g fill="#426b57"><circle cx="123" cy="341" r="7"/><circle cx="314" cy="341" r="7"/><circle cx="505" cy="341" r="7"/><circle cx="696" cy="341" r="7"/><circle cx="887" cy="341" r="7"/><circle cx="1078" cy="341" r="7"/></g>
  <g fill="#58675c" text-anchor="middle"><text x="123" y="369">目标</text><text x="314" y="369">诊断</text><text x="505" y="369">短课</text><text x="696" y="369">项目</text><text x="887" y="369">面试</text><text x="1078" y="369">档案</text></g>
</g>
</svg>